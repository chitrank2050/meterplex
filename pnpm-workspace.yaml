packages:
  - '.'
overrides:
  '@hono/node-server': '>=2.0.6'
  js-yaml: '>=4.2.0'
  markdown-it: '>=14.2.0'
  multer: '>=2.2.0'
publicHoistPattern:
  - '*'
packageImportMethod: clone-or-copy
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  lefthook: true
  prisma: true
